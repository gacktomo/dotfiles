# mise bootstrap 用の宣言的セットアップ。
# 確認は `mise bootstrap plan`、適用は `mise bootstrap`。

#-------------------------------------------------------------------
# packages: brew (macOS) / apt (Linux)
#-------------------------------------------------------------------
[bootstrap.packages]
# CLI (macOS は brew / Linux は apt)
"brew:git" = "latest"
"brew:fish" = { os = "macos" }
"apt:fish" = { os = "linux" }
"brew:peco" = "latest"
"brew:fzf" = "latest"
"brew:asdf" = "latest" # mise への移行が済んだら消す
"brew:go" = { os = "macos" }
"apt:golang" = { os = "linux" }
"brew:ssh-copy-id" = "latest"
"brew:ghq" = "latest"
"brew:tmux" = "latest"
"brew:jq" = "latest"
"brew:direnv" = "latest"
"brew:yqrashawn/goku/goku" = "latest"
"brew:go-task" = "latest"
"brew:gh" = "latest"
"brew:awscli" = "latest"
"brew:tree" = "latest"

# nvim 関連
"brew:neovim" = "latest"
"brew:fd" = "latest"
"brew:ripgrep" = "latest"
"brew:luarocks" = "latest"
"brew:lazygit" = "latest"

# フォント
"brew-cask:font-hackgen" = { os = "macos" }
"brew-cask:font-hackgen-nerd" = { os = "macos" }
"brew-cask:font-cica" = { os = "macos" }
"brew-cask:font-powerline-symbols" = { os = "macos" }
"apt:fonts-powerline" = { os = "linux" }

# GUI アプリ
"brew-cask:google-chrome" = { os = "macos" }
"brew-cask:google-japanese-ime" = { os = "macos" }
"brew-cask:visual-studio-code" = { os = "macos" }
"brew-cask:docker-desktop" = { os = "macos" }
"brew-cask:slack" = { os = "macos" }
"brew-cask:karabiner-elements" = { os = "macos" }
"brew-cask:tableplus" = { os = "macos" }
"brew-cask:raycast" = { os = "macos" }
"brew-cask:zoom" = { os = "macos" }
# aerospace は post-packages フックで入れる: 独自 tap の cask 定義の評価に Ruby 3 が必要で、
# system ruby 2.6 だと status/plan ごと失敗するため
"brew-cask:claude-code" = { os = "macos" }
"brew-cask:cmux" = { os = "macos" }
"brew-cask:amical" = { os = "macos" }

[settings]
# dotfile_groups の root はここからの相対。既定は ~/.dotfiles なので本リポジトリを指す
dotfiles.root = "."

#-------------------------------------------------------------------
# dotfiles: ディレクトリ名 = 配置先 (home -> ~, config -> ~/.config, claude -> ~/.claude)
#-------------------------------------------------------------------
[dotfile_groups.home]
root = "home"
target = "~"

[dotfile_groups.config]
root = "config"
target = "~/.config"
exclude = ["*.md"]

# nvim はディレクトリごと symlink (LazyVim が lazy-lock.json を書き戻すため)
[dotfile_groups.config.entries]
"~/.config/nvim" = { mode = "symlink" }

[dotfile_groups.claude]
root = "claude"
target = "~/.claude"

[dotfile_groups.claude.entries]
"~/.claude/skills" = { mode = "symlink" }

#-------------------------------------------------------------------
# macOS 設定: defaults write 群
#-------------------------------------------------------------------
[bootstrap.macos.dock]
apps = []            # persistent-apps を空に
show_recents = false
mru_spaces = false
autohide = true

[bootstrap.macos.finder]
show_pathbar = true

[bootstrap.macos.keyboard]
initial_key_repeat = 20
key_repeat = 1 # 元スクリプトは -int 1.5 だが defaults は 1 に切り捨てる

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[bootstrap.macos.defaults]
NSGlobalDomain = { AppleShowAllExtensions = true, "com.apple.mouse.scaling" = 1.5, "com.apple.trackpad.scaling" = 2.0 }
"com.apple.menuextra.battery" = { ShowPercent = "YES" }
"com.apple.menuextra.clock" = { DateFormat = "EEE d MMM HH:mm:ss" }

# -currentHost 付きなので defaults_entries で書く
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
host = "current"
value = true

#-------------------------------------------------------------------
# ツール: asdf plugin add nodejs/bun/java の置き換え
#-------------------------------------------------------------------
[tools]
node = "25"   # asdf の 25.8.1 相当
bun = "latest"
java = "11"   # asdf の adoptopenjdk-11 相当

#-------------------------------------------------------------------
# ログインシェル: chsh -s fish
#-------------------------------------------------------------------
[bootstrap.user]
login_shell = "fish"

#-------------------------------------------------------------------
# 宣言的に書けないもの: 毎回走るので冪等に書くこと
#-------------------------------------------------------------------
[bootstrap.hooks]
post-packages = [
  "[ \"$(uname)\" != Darwin ] || brew list --cask aerospace >/dev/null 2>&1 || brew install --cask nikitabobko/tap/aerospace",
]

# CapsLock <-> Control (hidutil は mise の管理対象外)
post-defaults = [
  '''hidutil property --set '{"UserKeyMapping":[{"HIDKeyboardModifierMappingSrc":0x700000039,"HIDKeyboardModifierMappingDst":0x7000000E0}]}' >/dev/null''',
  "killall Dock || true",
  "killall Finder || true",
]

# curl 配布のインストーラ 2 つ
post-dotfiles = [
  "test -f ~/.vim/autoload/plug.vim || curl -fLo ~/.vim/autoload/plug.vim --create-dirs https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim",
  "test -f ~/.config/fish/functions/fisher.fish || curl -sL https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish --create-dirs -o ~/.config/fish/functions/fisher.fish",
  # karabiner.json は karabiner.edn からの生成物なので git 管理せずここで作る
  "goku",
]

# skills CLI のグローバル lock (home/.agents/.skill-lock.json) にあるスキルを Claude Code に入れる。
# lock から一括復元するコマンドが無いので、未導入のものだけ add し直す
post-tools = [
  '''jq -r '.skills | to_entries[] | "\(.value.source) \(.key)"' ~/.agents/.skill-lock.json | while read -r src name; do [ -e ~/.claude/skills/"$name" ] || mise x -- npx -y skills add "$src" -g -a claude-code -y -s "$name" </dev/null; done''',
]

final = "fish -c 'fisher update' || true"
